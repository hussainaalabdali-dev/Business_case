[project]
name = "feasibility-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "feasibility-engine",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "playwright==1.49.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["fonts/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: performance budgets from ROADMAP milestone 1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
